packages:
  - "apps/*"
  - "packages/*"

overrides:
  "@types/node": "22.19.19"
  uuid: ^11.1.1
  # Security: force patched transitives (pnpm audit --prod)
  brace-expansion@<2: 1.1.21
  brace-expansion@^2.0.1: 2.1.7
  fast-uri: ^3.1.8
  dompurify: ^3.4.16
  protobufjs: ^7.6.5
  # Security: transitive-only advisories (no upstream patched parent release)
  hono: ^4.13.13
  seroval: ^1.6.7
  image-size: ^2.0.3
  compression: ^1.8.2
  proxy-addr: ^2.0.8
  ip-address: ^10.7.1

allowBuilds:
  "@google/genai": true
  "core-js": true
  ecc-universal: set this to true or false
  "esbuild": true
  "protobufjs": true

minimumReleaseAgeExclude:
  - '@shadcn/registry@0.1.2'
  - '@typescript-eslint/eslint-plugin@8.71.1'
  - '@typescript-eslint/parser@8.71.1'
  - '@typescript-eslint/project-service@8.71.1'
  - '@typescript-eslint/scope-manager@8.71.1'
  - '@typescript-eslint/tsconfig-utils@8.71.1'
  - '@typescript-eslint/type-utils@8.71.1'
  - '@typescript-eslint/types@8.71.1'
  - '@typescript-eslint/typescript-estree@8.71.1'
  - '@typescript-eslint/utils@8.71.1'
  - '@typescript-eslint/visitor-keys@8.71.1'
  - shadcn@4.21.3
  - typescript-eslint@8.71.1
  - vite@8.3.3
