packages:
  - "apps/*"
  - "packages/*"

overrides:
  "@types/node": "22.19.19"
  uuid: ^11.1.1
  # Security: force patched transitives (pnpm audit --prod)
  brace-expansion@<2: 1.1.18
  brace-expansion@^2.0.1: 2.1.4
  fast-uri: 3.1.5
  dompurify: ^3.4.13
  protobufjs: ^7.6.5

allowBuilds:
  "@google/genai": true
  "core-js": true
  "ecc-universal": true
  "esbuild": true
  "protobufjs": true

minimumReleaseAgeExclude:
  - fast-uri@3.1.5
