version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-minor-patch:
        dependency-type: development
        update-types: [minor, patch]
      prod-minor-patch:
        dependency-type: production
        update-types: [minor, patch]
    # Majors stay ungrouped: they need their own branch and verification run.

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
