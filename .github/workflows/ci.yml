name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Version comes from package.json "packageManager" (pnpm 12).
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build

      # NOTE: `pnpm test:fast` is deliberately NOT run here.
      # 1. AGENTS.md requires asking Fajar before adding/running any non-E2E
      #    test, and the unit-suite manifests are legacy inventory, not
      #    permission to run them.
      # 2. The api suite imports apps/api/src/lib/env.ts, which calls
      #    process.exit(1) when .env.local is absent, so it cannot pass on a
      #    clean runner without an env-injection step.
      # Re-enable only with explicit approval + env injection.

      # Fails the job on any prod advisory. pnpm 12's audit reports
      # transitive advisories that pnpm 11 missed, so keep it blocking.
      - name: Dependency audit (prod)
        run: pnpm audit --prod

  migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: New migrations have rollback scripts
        if: github.event_name == 'pull_request'
        run: node scripts/check-migration-rollbacks.mjs origin/${{ github.base_ref }}

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # supabase/config.toml is gitignored, so generate a default one. Starting
      # the stack replays every migration on a clean database. Only Postgres +
      # auth are needed for that. Blocking: every migration must apply to an
      # empty database (plans/markdown/migration-replay-empty-db.md).
      - name: Replay all migrations on a fresh local Supabase
        run: |
          set -o pipefail
          supabase init --force
          if ! supabase start -x storage-api,imgproxy,realtime,studio,edge-runtime,logflare,vector,mailpit,supavisor,postgres-meta 2>&1 | tee replay.log; then
            failed=$(grep -o 'Applying migration [^ ]*' replay.log | tail -1)
            echo "::warning title=Migration replay failed::${failed:-unknown migration} - $(grep -m1 '^ERROR' replay.log)"
            exit 1
          fi
