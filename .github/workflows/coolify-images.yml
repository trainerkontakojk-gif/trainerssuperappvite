name: Coolify images

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  backend:
    name: Build and push API / Telefun image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.render
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/trainerkontakojk-gif/trainers-backend:${{ github.sha }}
            ghcr.io/trainerkontakojk-gif/trainers-backend:latest
          labels: org.opencontainers.image.source=https://github.com/trainerkontakojk-gif/trainerssuperappvite
          cache-from: type=gha,scope=trainers-backend
          cache-to: type=gha,mode=max,scope=trainers-backend

      - name: Summarize pushed backend tags
        run: |
          {
            echo '### Backend image pushed'
            echo "- ghcr.io/trainerkontakojk-gif/trainers-backend:${GITHUB_SHA}"
            echo '- `ghcr.io/trainerkontakojk-gif/trainers-backend:latest`'
          } >> "$GITHUB_STEP_SUMMARY"

  web:
    name: Build and push Web image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check required GitHub Variables
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_APP_URL: ${{ vars.VITE_APP_URL }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_TELEFUN_WS_URL: ${{ vars.VITE_TELEFUN_WS_URL }}
        run: |
          missing=()
          [[ -n "$VITE_API_URL" ]] || missing+=(VITE_API_URL)
          [[ -n "$VITE_APP_URL" ]] || missing+=(VITE_APP_URL)
          [[ -n "$VITE_SUPABASE_URL" ]] || missing+=(VITE_SUPABASE_URL)
          [[ -n "$VITE_SUPABASE_ANON_KEY" ]] || missing+=(VITE_SUPABASE_ANON_KEY)
          [[ -n "$VITE_TELEFUN_WS_URL" ]] || missing+=(VITE_TELEFUN_WS_URL)
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing required repository Variables: %s\n' "${missing[*]}" >&2
            exit 1
          fi

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push web image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.web
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/trainerkontakojk-gif/trainers-web:${{ github.sha }}
            ghcr.io/trainerkontakojk-gif/trainers-web:latest
          labels: org.opencontainers.image.source=https://github.com/trainerkontakojk-gif/trainerssuperappvite
          cache-from: type=gha,scope=trainers-web
          cache-to: type=gha,mode=max,scope=trainers-web
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL }}
            VITE_APP_URL=${{ vars.VITE_APP_URL }}
            VITE_SUPABASE_URL=${{ vars.VITE_SUPABASE_URL }}
            VITE_SUPABASE_ANON_KEY=${{ vars.VITE_SUPABASE_ANON_KEY }}
            VITE_TELEFUN_WS_URL=${{ vars.VITE_TELEFUN_WS_URL }}

      - name: Summarize pushed web tags
        run: |
          {
            echo '### Web image pushed'
            echo "- ghcr.io/trainerkontakojk-gif/trainers-web:${GITHUB_SHA}"
            echo '- `ghcr.io/trainerkontakojk-gif/trainers-web:latest`'
          } >> "$GITHUB_STEP_SUMMARY"
